name: Build and Release Executables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: existence-linux
            asset_name: existence-linux-x86_64
          - os: macos-latest
            artifact_name: existence-macos
            asset_name: existence-macos-x86_64
          - os: windows-latest
            artifact_name: existence-windows.exe
            asset_name: existence-windows-x86_64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile existence.py --name ${{ matrix.artifact_name }}

      - name: Build Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile existence.py --name existence-windows

      - name: Rename Artifact for Release (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Rename Artifact for Release (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          rename dist\existence-windows.exe ${{ matrix.asset_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create or Update Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: |
            Automated build binaries for `existence.py` generated via manual workflow dispatch.
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
