name: Build and Release Executables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: existence-linux
            asset_name: existence-linux-x86_64
          - os: macos-latest
            artifact_name: existence-macos
            asset_name: existence-macos-x86_64
          - os: windows-latest
            artifact_name: existence-windows.exe
            asset_name: existence-windows-x86_64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Executable
        run: |
          pyinstaller --onefile existence.py --name ${{ matrix.artifact_name }}

      - name: Rename Artifact for Release
        run: |
          python -c "import os; os.rename('dist/${{ matrix.artifact_name }}', 'dist/${{ matrix.asset_name }}')"

      - name: Build AppImage (Linux CLI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          cp dist/${{ matrix.asset_name }} AppDir/usr/bin/existence

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/existence" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/existence.desktop
          [Desktop Entry]
          Name=Existence
          Exec=existence
          Icon=existence
          Type=Application
          Terminal=true
          Categories=Utility;
          EOF

          python3 -c "from PIL import Image; Image.new('RGB', (64, 64), color=(50, 100, 200)).save('AppDir/existence.png')"

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dist/existence-x86_64.AppImage

      - name: Build Flatpak (Linux CLI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

          cat << 'EOF' > org.example.existence.yml
          app-id: org.example.existence
          runtime: org.freedesktop.Platform
          runtime-version: '23.08'
          sdk: org.freedesktop.Sdk
          command: existence
          modules:
            - name: existence
              buildsystem: simple
              build-commands:
                - install -D existence /app/bin/existence
              sources:
                - type: file
                  path: dist/existence-linux-x86_64
                  dest-filename: existence
          EOF

          flatpak-builder --force-clean build-dir org.example.existence.yml
          flatpak build-bundle build-dir dist/existence-x86_64.flatpak org.example.existence

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    name: Create or Update Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest Release
          body: |
            Automated build binaries for `existence.py` generated via manual workflow dispatch.
          draft: false
          prerelease: false
          overwrite: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
